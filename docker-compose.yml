# Local "real persistence" stack: Postgres + the esy app (SPA + API).
# H2 (the default) is in-memory and resets on restart — fine for a demo, not
# for dynamic store signup / accounts / orders. This runs the app against
# Postgres with JPA_DDL_AUTO=update so created stores, users, memberships and
# orders survive restarts. Mirrors the Render paid setup (Render PostgreSQL).
#
#   docker compose up --build         # http://localhost:8092
#   docker compose down               # keep data (named volume)
#   docker compose down -v            # wipe data
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: esy
      POSTGRES_USER: esy
      POSTGRES_PASSWORD: esy
    volumes:
      - esy_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esy -d esy"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Redis/Valkey: the live config store (mirrors prod's Render Key Value).
  # The admin UI writes overrides here; the app reads Redis → env/yaml → default.
  # Empty is fine — the app just uses env/yaml. (Local dev = ephemeral, like the
  # Render free tier; add a volume if you want overrides to survive restarts.)
  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/esy
      SPRING_DATASOURCE_USERNAME: esy
      SPRING_DATASOURCE_PASSWORD: esy
      JPA_DDL_AUTO: update
      # Real Gmail sign-in: `cp .env.example .env`, fill it, `docker compose up`
      # (Compose auto-reads .env). Or export in the shell. Unset → Gmail inert;
      # email dev-login still works. No secrets in the repo (.env is gitignored).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Canonical OAuth host. Unset = bare localhost dev (no funnel).
      # lvh.me dev: http://lvh.me:8092 | prod: https://www.esy.ge
      APP_OAUTH2_CANONICAL_ORIGIN: ${APP_OAUTH2_CANONICAL_ORIGIN:-}
      # Emails granted ADMIN on sign-in. Without this passed through,
      # app.admin-emails resolves empty and nobody gets ADMIN in this stack.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # Signing key for the session JWT. Unset falls back to the dev default in
      # application.yml, which invalidates tokens whenever that default changes.
      JWT_SECRET: ${JWT_SECRET:-}
      # SMS (smsoffice.ge) — delivers the phone one-time code. Leave UNSET
      # locally: with no key (and the dev fallback below) the code is logged and
      # returned to the browser so verification works without spending
      # messages. Set it and the code is only ever delivered by SMS.
      APP_SMS_KEY: ${APP_SMS_KEY:-}
      # Local only: lets a keyless stack hand the code back. Never set on Render.
      APP_SMS_DEV_FALLBACK: ${APP_SMS_DEV_FALLBACK:-true}
      # Sender name shown to the recipient. Must be registered with SMS Office
      # or every send is refused with ErrorCode 150. Blank uses "esy.ge".
      APP_SMS_SENDER: ${APP_SMS_SENDER:-}
      # Transactional email (Resend). Leave UNSET locally: with no key nothing
      # is sent and nothing fails. Every var must be listed here explicitly or
      # it silently never reaches the container (this is how ADMIN_EMAILS was
      # dropped).
      APP_EMAIL_KEY: ${APP_EMAIL_KEY:-}
      # Payments (Bank of Georgia). Per-store creds are entered in Store
      # Settings; these are platform knobs. All optional locally — unset
      # APP_SECRET_ENC_KEY falls back to a dev key, unset BOG_PUBLIC_KEY
      # skips callback signature checks (BOG can't reach lvh.me anyway).
      APP_SECRET_ENC_KEY: ${APP_SECRET_ENC_KEY:-}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-}
      # BOG environment: live (default) or sandbox — flips both hosts at once.
      # For local end-to-end testing set BOG_ENV=sandbox in .env + sandbox creds.
      BOG_ENV: ${BOG_ENV:-live}
      BOG_PUBLIC_KEY: ${BOG_PUBLIC_KEY:-}
      # Explicit host overrides — leave blank to derive from BOG_ENV.
      BOG_BASE_URL: ${BOG_BASE_URL:-}
      BOG_AUTH_URL: ${BOG_AUTH_URL:-}
      # Live config store (Redis/Valkey). The admin UI writes overrides here.
      SPRING_DATA_REDIS_URL: redis://redis:6379
    ports:
      - "8092:8080"

volumes:
  esy_pgdata:
