# Render Blueprint — a Docker web service (SPA + API).
# By default the DB is in-memory H2 (data resets on every deploy). For real
# persistence, provision a Render PostgreSQL and set SPRING_DATASOURCE_URL/
# USERNAME/PASSWORD on the web service (see deploy/render.md). JPA_DDL_AUTO is
# `update` (NOT create-drop) so a persistent Postgres is never dropped on
# deploy — heed the ddl-auto=update traps in CLAUDE.md.
services:
  - type: web
    name: esy
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/products
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Additive migrations; on H2 (no datasource set) this still creates a
      # fresh schema each boot. On Postgres it preserves data across deploys.
      - key: JPA_DDL_AUTO
        value: update
