# Render Blueprint — a Docker web service (SPA + API) and the Key Value store
# behind live config.
# By default the DB is in-memory H2 (data resets on every deploy). For real
# persistence, provision a Render PostgreSQL and set SPRING_DATASOURCE_URL/
# USERNAME/PASSWORD on the web service (see deploy/render.md). JPA_DDL_AUTO is
# `update` (NOT create-drop) so a persistent Postgres is never dropped on
# deploy — heed the ddl-auto=update traps in CLAUDE.md.
services:
  - type: web
    name: esy
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/products
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      # Additive migrations; on H2 (no datasource set) this still creates a
      # fresh schema each boot. On Postgres it preserves data across deploys.
      - key: JPA_DDL_AUTO
        value: update
      # ConfigStore reads and writes here. Without it every write from
      # admin.esy.ge/config and /integrations fails with a 502 and those
      # screens are read-only — which is the state prod was in.
      - key: SPRING_DATA_REDIS_URL
        fromService:
          type: keyvalue
          name: esy-config
          property: connectionString
      # The sender name SMS Office checks against its registered list. It is
      # ALSO settable from admin.esy.ge/integrations, which stores it in the
      # Key Value above — and that store is non-persistent on the free plan, so
      # a restart drops the override and the app silently falls back to here,
      # then to the built-in "esy.ge". If this is unset and the registered name
      # is anything else, every message is refused or quietly undelivered from
      # the moment the store restarts. Set in the dashboard, not the blueprint.
      - key: APP_SMS_SENDER
        sync: false
      # Resend API key for transactional email. Unset = no mail is sent and
      # nothing fails. A secret, so it never lives in the blueprint.
      - key: APP_EMAIL_KEY
        sync: false

  # Live config: the service-fee rate, the SMS sender and the message
  # templates. Small and write-rarely — the app re-reads through an 8s cache
  # and degrades to env/defaults whenever this is unreachable, so the site
  # stays up if it goes away.
  # The name must stay `esy-config`: that is the instance production already
  # runs against. A blueprint sync matches by name, so calling it anything else
  # provisions a SECOND store, repoints SPRING_DATA_REDIS_URL at the empty one
  # and abandons every override an admin has saved.
  - type: keyvalue
    name: esy-config
    plan: free
    region: oregon
    # Private network only: nothing outside Render needs to reach it.
    ipAllowList: []
    # NOT the allkeys-lru default. These keys are configuration, not a cache —
    # evicting one silently reverts a setting an admin deliberately made, and
    # the app would read the old env value with nothing to indicate why.
    maxmemoryPolicy: noeviction
