spring:
  application:
    name: ecommerce-platform
  
  # Seeding is handled by DataInitializer.java; data.sql is comment-only, so
  # disable Spring's SQL init (an empty/comment-only script otherwise errors).
  sql:
    init:
      mode: never

  datasource:
    # Dev default: in-memory (DB_CLOSE_DELAY=-1 keeps it alive for the JVM).
    # Prod (EC2): override SPRING_DATASOURCE_URL to a file path so data
    # persists across restarts, e.g.
    #   jdbc:h2:file:/var/lib/esy/esydb;DB_CLOSE_DELAY=-1
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: org.h2.Driver
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      # Dev wipes/recreates (in-memory); prod sets JPA_DDL_AUTO=update so the
      # file-backed schema/data survive restarts.
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            # Host-agnostic: resolves to the real external URL per request
            # (needs server.forward-headers-strategy below behind Render's proxy).
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          apple:
            client-id: ${APPLE_CLIENT_ID:your-apple-client-id}
            client-secret: ${APPLE_CLIENT_SECRET:your-apple-client-secret}
            client-name: Apple
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            user-name-attribute: id
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            user-info-uri: https://appleid.apple.com/auth/userinfo
            user-name-attribute: sub

server:
  # PaaS hosts (Render, etc.) inject the port via $PORT; default to 8080 locally.
  port: ${PORT:8080}
  # Honor X-Forwarded-* from Render's TLS proxy so OAuth redirect URIs are
  # built as https://<external-host>/... (must match Google Cloud config).
  forward-headers-strategy: framework
  # TEMP DIAGNOSTIC — surface the real exception on the error page so the
  # OAuth 500 can be diagnosed without server-log access. Revert after.
  error:
    include-message: always
    include-exception: true
    include-stacktrace: always

# Where the OAuth2 success/failure handler sends the browser back to. Empty =
# same origin (Render: the jar serves the SPA). For local dev set
# APP_OAUTH2_REDIRECT_BASE=http://localhost:5173 (the Vite dev origin).
app:
  oauth2:
    redirect-base: ${APP_OAUTH2_REDIRECT_BASE:}

# Multi-tenant configuration
tenant:
  domain: esy.ge
  default-subdomain: main
  cors:
    allowed-origins:
      - "https://*.esy.ge"
      - "http://localhost:3000"
      - "http://localhost:8080"

logging:
  level:
    com.esyback.ecommerce: DEBUG
    org.springframework.security: DEBUG

jwt:
  # HS512 requires a key of at least 512 bits (64 bytes). This dev default is long
  # enough so local runs work without setting JWT_SECRET; override it in production.
  secret: ${JWT_SECRET:dev-local-esy-jwt-secret-please-override-in-production-0123456789abcdef}
  expiration: 86400000 # 24 hours
