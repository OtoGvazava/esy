spring:
  application:
    name: ecommerce-platform

  # ── Live config store (Redis / Valkey — Render Key Value) ────────────────
  # The admin UI writes overrides here; the config beans read Redis → env/yaml →
  # default at call time (see ConfigStore). Blank/absent = ConfigStore just uses
  # env/yaml, so the app runs fine with no Redis. Prod: SPRING_DATA_REDIS_URL =
  # the Render Key Value internal URL (redis://<id>:6379).
  data:
    redis:
      url: ${SPRING_DATA_REDIS_URL:redis://localhost:6379}
      timeout: 2000
      connect-timeout: 2000
      lettuce:
        shutdown-timeout: 200
      # We use only StringRedisTemplate (ConfigStore) — not Redis repositories.
      # Disable Redis repo scanning so it doesn't try to claim the JPA repositories.
      repositories:
        enabled: false

  # Seeding is handled by DataInitializer.java; data.sql is comment-only, so
  # disable Spring's SQL init (an empty/comment-only script otherwise errors).
  sql:
    init:
      mode: never

  datasource:
    # Dev default: in-memory (DB_CLOSE_DELAY=-1 keeps it alive for the JVM).
    # Prod (EC2): override SPRING_DATASOURCE_URL to a file path so data
    # persists across restarts, e.g.
    #   jdbc:h2:file:/var/lib/esy/esydb;DB_CLOSE_DELAY=-1
    # Driver + Hibernate dialect are auto-detected from the URL, so the same
    # build runs on H2 (default) or Postgres just by setting SPRING_DATASOURCE_*.
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:password}

  # Product photo uploads (multipart). Per-file cap is also enforced in
  # ProductImageService; request cap allows a few images per upload.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  h2:
    console:
      enabled: false
      path: /h2-console

  jpa:
    hibernate:
      # Dev wipes/recreates (in-memory); prod sets JPA_DDL_AUTO=update so the
      # file-backed schema/data survive restarts.
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-client-secret}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
              - email
            # Host-agnostic: resolves to the real external URL per request
            # (needs server.forward-headers-strategy below behind Render's proxy).
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          apple:
            client-id: ${APPLE_CLIENT_ID:your-apple-client-id}
            client-secret: ${APPLE_CLIENT_SECRET:your-apple-client-secret}
            client-name: Apple
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v2/userinfo
            # With the openid scope Spring treats Google as OIDC; the subject
            # claim is "sub" (there is no "id"), so this must be "sub" or
            # DefaultOidcUser construction throws "Missing attribute 'id'".
            user-name-attribute: sub
          apple:
            authorization-uri: https://appleid.apple.com/auth/authorize
            token-uri: https://appleid.apple.com/auth/token
            user-info-uri: https://appleid.apple.com/auth/userinfo
            user-name-attribute: sub

server:
  # PaaS hosts (Render, etc.) inject the port via $PORT; default to 8080 locally.
  port: ${PORT:8080}
  # Honor X-Forwarded-* from Render's TLS proxy so OAuth redirect URIs are
  # built as https://<external-host>/... (must match Google Cloud config).
  forward-headers-strategy: framework

# Where the OAuth2 success/failure handler sends the browser back to. Empty =
# same origin (Render: the jar serves the SPA). For local dev set
# APP_OAUTH2_REDIRECT_BASE=http://localhost:5173 (the Vite dev origin).
#
# canonical-origin: the single host the whole Google handshake runs on so its
# one registered redirect URI matches for every wildcard tenant subdomain
# (e.g. https://www.esy.ge). Empty = no funnel (local/dev, single host).
app:
  oauth2:
    redirect-base: ${APP_OAUTH2_REDIRECT_BASE:}
    canonical-origin: ${APP_OAUTH2_CANONICAL_ORIGIN:}

  # Internet-reachable origin BOG redirects/calls back to. Empty = derive
  # from the request (fine in prod same-origin). Local dev: BOG can't reach
  # lvh.me anyway, so the /pay/return page reconciles via the receipt API.
  public-base-url: ${APP_PUBLIC_BASE_URL:}

  # Comma-separated emails granted the ADMIN role on sign-in (the ONLY way ADMIN
  # is assigned). Overridable live via the config store (config:app.admin-emails).
  admin-emails: ${ADMIN_EMAILS:}

  # SMS delivery for the phone one-time code (smsoffice.ge). Empty key = no
  # account: the code is logged and returned to the browser so local work needs
  # no messages. Set it and the code is delivered only by SMS. The sender name
  # must be registered with SMS Office; it is read live from the config store
  # (config:app.sms.sender) so it can be changed without a redeploy.
  sms:
    key: ${APP_SMS_KEY:}
    # The name a recipient sees. SMS Office refuses any message whose sender is
    # not registered with them (ErrorCode 150), so this must match one they have
    # approved. It is read through the config store, which resolves Redis
    # override → this env value → the built-in default — so a deployment with no
    # Key Value service can still set it here, which is the only way to change
    # it when the admin screen cannot save.
    sender: ${APP_SMS_SENDER:}

  # Transactional email (Resend). Empty key = nothing is sent and nothing
  # fails: an order still completes, it just goes unannounced by mail. The
  # from-address must be on a domain verified with Resend or every send is
  # refused; it is read through the config store so it can be corrected live,
  # which is the lesson the SMS sender name taught the hard way.
  email:
    key: ${APP_EMAIL_KEY:}

  # AES key for secrets stored at rest (per-tenant BOG client secret). Any
  # length (SHA-256 derived, like the JWT key). Dev default works locally;
  # MUST be overridden in prod — changing it invalidates stored secrets, so
  # stores would need to re-enter their BOG credentials.
  secret:
    enc-key: ${APP_SECRET_ENC_KEY:dev-local-esy-secret-encryption-key-override-in-prod}

  # Bank of Georgia endpoints + the callback-signing public key. The key has
  # NO default on purpose: a wrong key rejects every real payment callback.
  # Unset → signature checks are skipped (logged) so local dev works; prod
  # MUST set BOG_PUBLIC_KEY to the PEM from
  # https://api.bog.ge/docs/en/payments/callback so callbacks are enforced.
  bog:
    # Environment: live (default) or sandbox. One switch flips BOTH hosts:
    #   live    → oauth2.bog.ge         + api.bog.ge
    #   sandbox → oauth2-sandbox.bog.ge  + api-sandbox.bog.ge  (isolated test
    #             space, no real charges; test cards in the sandbox docs).
    # A store's saved Client ID/Secret must belong to the selected environment.
    env: ${BOG_ENV:live}
    # Explicit host overrides — blank = derived from env above. Rarely needed.
    auth-url: ${BOG_AUTH_URL:}
    base-url: ${BOG_BASE_URL:}
    public-key: ${BOG_PUBLIC_KEY:}

  # Platform service fee accrued per order (fraction of order total; 0.02 =
  # 2%). Frozen onto each order at creation; the shopper never sees/pays it
  # and it does not change the BOG charge. Tunable without a redeploy.
  platform:
    service-fee-rate: ${PLATFORM_SERVICE_FEE_RATE:0.02}

# Multi-tenant configuration
tenant:
  domain: esy.ge
  default-subdomain: main
  cors:
    allowed-origins:
      - "https://*.esy.ge"
      - "http://localhost:3000"
      - "http://localhost:8080"

logging:
  level:
    com.esyback.ecommerce: DEBUG
    org.springframework.security: DEBUG

jwt:
  # HS512 requires a key of at least 512 bits (64 bytes). This dev default is long
  # enough so local runs work without setting JWT_SECRET; override it in production.
  secret: ${JWT_SECRET:dev-local-esy-jwt-secret-please-override-in-production-0123456789abcdef}
  expiration: 86400000 # 24 hours

# Actuator: expose only /actuator/health (public probe); no other endpoints.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
