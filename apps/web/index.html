<!doctype html>
<!-- lang defaults to Georgian to match the app's default language; the SPA
     updates it on every language change (see useAppTheme). -->
<html lang="ka" data-th="esy" data-md="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The theme tokens key off data-md on <html>. Setting it before the first
         paint, from the same stored choice useAppTheme reads, keeps a dark-mode
         visitor from seeing one light frame. ThemeRoot takes over on mount. -->
    <script>
      try {
        var m = localStorage.getItem('theme-mode');
        if (m !== 'light' && m !== 'dark') m = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-md', m);
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Geist draws Latin and Noto Sans Georgian draws Mkhedruli: Georgian is
         the default language, and without that face KA copy falls through to a
         system default that does not match the Latin type. -->
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..800&family=Noto+Sans+Georgian:wght@400..800&display=swap" rel="stylesheet" />
    <title>esy</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
